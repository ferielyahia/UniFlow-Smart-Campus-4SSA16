# ===== Service =====
spring.application.name=room-service
server.port=8085

# ===== Base de donnees MySQL =====
spring.datasource.url=jdbc:mysql://localhost:3306/room_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# ===== Eureka (client) =====
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.healthcheck.enabled=true

# ===== Actuator =====
management.endpoints.web.exposure.include=health,info,metrics,loggers
management.endpoint.health.show-details=always
management.info.env.enabled=true
management.health.rabbit.enabled=false

# ===== Swagger : afficher aussi les endpoints Actuator =====
springdoc.show-actuator=true

# ===== Contenu de /actuator/info =====
info.app.name=room-service
info.app.version=1.0.0
info.app.description=Gestion des salles, equipements et reservations
info.app.team=UniFlow - Equipe 4SSA16
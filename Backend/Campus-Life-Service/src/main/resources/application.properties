spring.application.name=campus-life-service
server.port=8086

spring.datasource.url=jdbc:mysql://localhost:3306/campus_life_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Enregistrer l'IP au lieu du hostname (corrige DESKTOP-M2IK5UJ.mshome.net)
eureka.instance.prefer-ip-address=true
# ID unique par instance (utile si tu lances plusieurs instances)
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Exposer les endpoints health, info et metrics (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health (db, diskSpace, ping…)
management.endpoint.health.show-details=always
# Variante : afficher les composants sans leurs détails
#management.endpoint.health.show-components=always
# Transmettre à Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true
# Contenu affiché par /actuator/info
info.app.name=campus life
info.app.version=1.0.0
info.app.description=Microservice de gestion des events universitaire

server.forward-headers-strategy=framework